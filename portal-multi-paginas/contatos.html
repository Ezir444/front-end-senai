<!DOCTYPE html>

        <title>Contatos</title>

    <body>
        <header>
            <nav>
                <a href="index.html" rel="home">Inicio</a>
                <a href="planos.html" rel="planos" target="_blank">Nossos planos</a>
                <a href="contatos.html" rel="contatos">Contato</a>
            </nav>

        <main>
        <h2>Faça contato Conosco</h2>
            <form action="#" method="POST">
                <fieldset>
                    <legend><b>Informações para contato</b></legend>
                    <label for="campo-nome">Nome: </label><br>
                    <input type="text" name="nome-completo" id="campo-nome" placeholder="Digite seu nome" required size="40"><br>
                    <label for="campo-telefone">Telefone: </label><br>
                    <input type="text" name="telefone-completo" id="campo-telefone" placeholder="Digite seu telefone" required size="40"><br>
                    <label for="campo-email">Email: </label><br>
                    <input type="text" name="email-completo" id="campo-email" placeholder="Digite seu email" required size="40">
                </fieldset>
            </form>
        </main>
    </body>
